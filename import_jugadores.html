        function log(msg) {
            const div = document.getElementById('log');
            div.innerHTML += `<div>${msg}</div>`;
            div.scrollTop = div.scrollHeight;
        }

        document.getElementById('btn-importar').addEventListener('click', async () => {
            const btn = document.getElementById('btn-importar');
            btn.disabled = true;
            btn.textContent = "Procesando...";

            try {
                // 1. Obtener torneo activo desde localStorage
                let torneoId = localStorage.getItem('torneo_activo_id');
                
                if (!torneoId) {
                    const { data: latestTorneo } = await window.supabase.from('torneos').select('id').order('created_at', { ascending: false }).limit(1).single();
                    if (latestTorneo) {
                        torneoId = latestTorneo.id;
                    }
                }

                if (!torneoId) {
                    log("No hay torneo activo, abortando.");
                    return;
                }
                log(`Torneo Activo ID: ${torneoId}`);

                // 2. Cargar todos los equipos del torneo
                let { data: equipos } = await window.supabase.from('equipos').select('id, nombre').eq('torneo_id', torneoId);
                log(`Se encontraron ${equipos.length} equipos en la base de datos.`);

                // Preparar mapa de nombres a IDs
                const equipoMap = {};
                equipos.forEach(eq => {
                    equipoMap[eq.nombre.toUpperCase()] = eq.id;
                });

                let insertCount = 0;
                let skipCount = 0;
                let equiposCreados = 0;

                for (const p of playersToImport) {
                    let eqId = equipoMap[p.team.toUpperCase()];
                    
                    if (!eqId) {
                        // Buscar aproximado
                        const match = equipos.find(e => e.nombre.toUpperCase().includes(p.team.toUpperCase()) || p.team.toUpperCase().includes(e.nombre.toUpperCase()));
                        if (match) {
                            eqId = match.id;
                        } else {
                            // ¡CREAR EL EQUIPO AUTOMÁTICAMENTE!
                            log(`<span style="color:orange">El equipo "${p.team}" no existe. Creándolo automáticamente...</span>`);
                            
                            const newTeamId = Date.now().toString() + Math.floor(Math.random() * 1000);
                            
                            const { error: eqError } = await window.supabase.from('equipos').insert([{
                                id: newTeamId,
                                torneo_id: torneoId,
                                nombre: p.team,
                                logo: ''
                            }]);
                            
                            if (eqError) {
                                log(`<span style="color:red">Error creando equipo ${p.team}: ${eqError.message}</span>`);
                                skipCount++;
                                continue;
                            }
                            
                            eqId = newTeamId;
                            equipoMap[p.team.toUpperCase()] = eqId;
                            equipos.push({ id: eqId, nombre: p.team });
                            equiposCreados++;
                        }
                    }

                    // Generar un ID único para el jugador
                    const playerId = Date.now().toString() + Math.floor(Math.random() * 1000000);

                    // Insertar jugador
                    const { error } = await window.supabase.from('jugadores').insert([{
                        id: playerId,
                        torneo_id: torneoId,
                        equipo_id: eqId,
                        nombre: p.name,
                        status: 'activo',
                        is_novato: false,
                        is_portero: false,
                        stats_apertura_goles: 0,
                        stats_apertura_amarillas: 0,
                        stats_apertura_rojas: 0,
                        stats_apertura_goles_recibidos: 0,
                        stats_clausura_goles: 0,
                        stats_clausura_amarillas: 0,
                        stats_clausura_rojas: 0,
                        stats_clausura_goles_recibidos: 0
                    }]);

                    if (error) {
                        log(`<span style="color:red">ERROR insertando a ${p.name}: ${error.message}</span>`);
                    } else {
                        log(`<span style="color:green">Ingresado: ${p.name} (${p.team})</span>`);
                        insertCount++;
                    }
                }

                log(`<br><strong>¡PROCESO TERMINADO!</strong> Equipos creados: ${equiposCreados} | Jugadores insertados: ${insertCount} | Omitidos: ${skipCount}`);

            } catch (err) {
                log(`<span style="color:red">Error crítico: ${err.message}</span>`);
            } finally {
                btn.textContent = "Finalizado";
            }
        });
